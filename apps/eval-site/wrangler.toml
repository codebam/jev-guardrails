name = "eval-site"
main = "src/index.ts"
compatibility_date = "2026-09-19"
compatibility_flags = ["nodejs_compat"]

# Replace this with the id printed by `npx wrangler d1 create eval-guardrails-db`.
# The all-zero placeholder is accepted for --local development.
[[d1_databases]]
binding = "DB"
database_name = "eval-guardrails-db"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[vars]
# Public, non-secret configuration. Git commit is fine for these values.
OPENROUTER_MODEL = "~typesafe/jev-latest"
EVAL_FREE_CREDITS = "250"
EVAL_PUBLIC_URL = "https://eval.seanbehan.ca"

# Public GitHub OAuth app client id. The device flow needs no client secret.
GITHUB_CLIENT_ID = "Ov23liR6pdTAUotNybDJ"

# Stripe price ids are public identifiers, not secrets. Uncomment and fill in
# after creating the products in Stripe:
STRIPE_PRICE_P5000 = "price_1UHZXhGZ6UCawHaLRTM4RbN9"
STRIPE_PRICE_P25000 = "price_1UHZXiGZ6UCawHaLWcxtgekN"
STRIPE_PRICE_P100000 = "price_1UHZXiGZ6UCawHaLVIa6OH36"
STRIPE_PRICE_P500000 = "price_1UHZXjGZ6UCawHaLeydD4DEw"

# Secrets are never stored in this file. Set them with:
#   npx wrangler secret put OPENROUTER_API_KEY
#   npx wrangler secret put EVAL_ADMIN_TOKEN
#   npx wrangler secret put STRIPE_SECRET_KEY
#   npx wrangler secret put STRIPE_WEBHOOK_SECRET

[observability]
enabled = true
