name = "eval-site"
main = "src/index.ts"
compatibility_date = "2026-09-19"
compatibility_flags = ["nodejs_compat"]

# Replace this with the id printed by `npx wrangler d1 create eval-guardrails-db`.
# The all-zero placeholder is accepted for --local development.
[[d1_databases]]
binding = "DB"
database_name = "eval-guardrails-db"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[vars]
# Non-secret defaults. Secrets (OPENROUTER_API_KEY, EVAL_ADMIN_TOKEN) are set
# with `wrangler secret put` or in .dev.vars for local development.
OPENROUTER_MODEL = "~typesafe/jev-latest"

[observability]
enabled = true
